<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pingu family to-do, Sun 11 Oct</title><style>
body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:#fbf6ef;color:#3a2f28}
main{max-width:480px;margin:0 auto;padding:28px 18px}h1{font-size:1.4rem;margin:0 0 6px}
#prog{color:#8a7766;margin-bottom:10px}.bar{height:6px;background:#efe3d3;border-radius:3px;margin-bottom:20px}.bar i{display:block;height:100%;background:#e08a4f;border-radius:3px;transition:width .3s}
label{display:flex;align-items:center;gap:14px;background:#fff;padding:16px;border-radius:14px;margin-bottom:10px;box-shadow:0 1px 3px #0000000d;font-size:1.05rem}
input[type=checkbox]{width:24px;height:24px;accent-color:#e08a4f}details{margin-top:18px;color:#8a7766}details label{opacity:.6;text-decoration:line-through}
label.drag{opacity:.85;box-shadow:0 6px 18px #0003;position:relative;z-index:5}.h{margin-left:auto;font-size:1.4rem;color:#b9a68f;padding:4px 6px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}footer{text-align:center;color:#a8957f;font-size:.85rem;margin-top:30px}#msg{color:#c0392b;font-size:.9rem}#add{display:flex;gap:8px;margin:6px 0 10px}#add input{flex:1;min-width:0;font:inherit;font-size:16px;padding:14px;border:1px solid #efe3d3;border-radius:14px;background:#fff;color:inherit}#add button{font:inherit;padding:0 18px;border:0;border-radius:14px;background:#e08a4f;color:#fff;font-weight:600}#add button:disabled{opacity:.5}</style></head><body><main>
<h1 id="t">Pingu family to-do, Sun 11 Oct</h1><div id="prog">Loading…</div><div class="bar"><i id="b" style="width:0"></i></div>
<div id="list"></div><form id="add" autocomplete="off"><input id="ni" placeholder="Add item…" aria-label="New to-do" maxlength="120" enterkeyhint="done"><button id="ab">Add</button></form><details id="dd"><summary id="ds">Done</summary><div id="done"></div></details><div id="msg"></div>
<footer data-v="addv1">From Yuan's Grok bot</footer></main><script>
let DRAG=false;const U="https://api.restful-api.dev/objects/ff808181a09d98f701a129ee30e13afc";let S=null;
async function load(){if(DRAG)return;try{const r=await fetch(U,{cache:"no-store"});S=(await r.json());render();msg("")}catch(e){msg("Couldn't load, retrying…")}}
function msg(m){document.getElementById("msg").textContent=m}
function row(it){const l=document.createElement("label");const c=document.createElement("input");c.type="checkbox";c.checked=it.done;c.onchange=()=>toggle(it.id,c.checked);l.append(c,document.createTextNode(it.text));if(!it.done){const h=document.createElement("span");h.className="h";h.textContent="≡";h.setAttribute("aria-label","Drag to reorder");h.onclick=e=>e.preventDefault();h.addEventListener("pointerdown",e=>startDrag(e,l,h));l.append(h);l.dataset.id=it.id}return l}
function ordered(d){const o=(d.order||[]).filter(id=>d.items.some(i=>i.id===id));d.items.forEach(i=>{if(!o.includes(i.id))o.push(i.id)});return o.map(id=>d.items.find(i=>i.id===id))}
function startDrag(e,l,h){e.preventDefault();DRAG=true;h.setPointerCapture(e.pointerId);l.classList.add("drag");const L=document.getElementById("list");let y0=e.clientY;
const mv=ev=>{const dy=ev.clientY-y0;l.style.transform="translateY("+dy+"px)";const sib=[...L.children].filter(x=>x!==l);for(const s of sib){const r=s.getBoundingClientRect(),m=r.top+r.height/2,lr=l.getBoundingClientRect(),lm=lr.top+lr.height/2;
if(s.compareDocumentPosition(l)&Node.DOCUMENT_POSITION_FOLLOWING&&lm<m){const t0=l.offsetTop;L.insertBefore(l,s);y0+=l.offsetTop-t0;l.style.transform="translateY("+(ev.clientY-y0)+"px)";break}
if(s.compareDocumentPosition(l)&Node.DOCUMENT_POSITION_PRECEDING&&lm>m){const t0=l.offsetTop;L.insertBefore(l,s.nextSibling);y0+=l.offsetTop-t0;l.style.transform="translateY("+(ev.clientY-y0)+"px)";break}}};
const up=()=>{h.removeEventListener("pointermove",mv);h.removeEventListener("pointerup",up);h.removeEventListener("pointercancel",up);l.classList.remove("drag");l.style.transform="";DRAG=false;saveOrder([...L.children].map(x=>+x.dataset.id))};
h.addEventListener("pointermove",mv);h.addEventListener("pointerup",up);h.addEventListener("pointercancel",up)}
async function saveOrder(open){try{const r=await fetch(U,{cache:"no-store"});const f=await r.json();const cur=ordered(f.data).map(i=>i.id);const rest=cur.filter(id=>!open.includes(id));let k=0;const o=cur.map(id=>open.includes(id)?null:id);
const merged=[];const q=[...open.filter(id=>cur.includes(id))];cur.forEach(id=>{merged.push(open.includes(id)?q.shift():id)});f.data.order=merged;
const p=await fetch(U,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:f.name,data:f.data})});S=await p.json();render();msg("")}catch(e){msg("Couldn't save order, please try again");load()}}
function render(){const its=S.data.items,d=its.filter(i=>i.done).length;document.getElementById("prog").textContent=d===its.length?"All "+its.length+" done 🎉":d+" of "+its.length+" done";
document.getElementById("b").style.width=(100*d/its.length)+"%";const L=document.getElementById("list"),D=document.getElementById("done");L.innerHTML="";D.innerHTML="";
ordered(S.data).forEach(i=>(i.done?D:L).append(row(i)));document.getElementById("ds").textContent="Done ("+d+") – untick to undo";document.getElementById("dd").style.display=d?"":"none"}
async function toggle(id,v){try{const r=await fetch(U,{cache:"no-store"});const f=await r.json();f.data.items.find(i=>i.id===id).done=v;
const p=await fetch(U,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:f.name,data:f.data})});S=await p.json();render();msg("")}catch(e){msg("Couldn't save, please try again");load()}}
document.getElementById("add").onsubmit=async e=>{e.preventDefault();const I=document.getElementById("ni"),B=document.getElementById("ab"),t=I.value.trim();if(!t)return;B.disabled=true;try{const r=await fetch(U,{cache:"no-store"});const f=await r.json();const id=f.data.items.reduce((m,i)=>Math.max(m,i.id),0)+1;f.data.items.push({id,text:t,done:false});f.data.order=[...(f.data.order||[]),id];
const p=await fetch(U,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:f.name,data:f.data})});if(!p.ok)throw 0;S=await p.json();I.value="";render();msg("")}catch(e){msg("Couldn't add, please try again")}B.disabled=false};
load();setInterval(load,15000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});
</script></body></html>
